version: "3.8"

services:
  github-analytics:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATE_RANGE_START=2025-07-01
      - DATE_RANGE_END=2025-07-31
      - PORT=8080
    volumes:
      - ./.env:/root/.env:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
